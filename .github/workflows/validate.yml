name: Validate repository

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Project consistency checks
        run: python3 scripts/validate_project.py

      - name: Python syntax
        run: |
          python3 -m py_compile scripts/validate_project.py scripts/smoke_test.py scripts/test_generators.py
          python3 -m py_compile _build_i18n.py _build_rose.py

      - name: JavaScript syntax
        run: |
          node --check sw.js
          node --check game-data.js
          node --check scripts/test_game_data.js
          node --check scripts/test_match_engine.js
          node --check scripts/test_onboarding.js
          node --check scripts/test_progression.js
          node --check scripts/e2e_smoke.js

      - name: Game data integrity tests
        run: node scripts/test_game_data.js

      - name: Match engine balance tests
        run: node scripts/test_match_engine.js

      - name: Onboarding funnel tests
        run: node scripts/test_onboarding.js

      - name: Manager progression tests
        run: node scripts/test_progression.js

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Runtime backup tests
        run: php scripts/test_runtime_backup.php

      - name: Draft storage tests
        run: php scripts/test_draft_storage.php

      - name: Duel engine tests
        run: php scripts/test_duel_engine.php

      - name: Duel draft session tests
        run: php scripts/test_duel_draft.php

      - name: Generator E2E tests
        run: python3 scripts/test_generators.py

      - name: HTTP smoke test
        run: python3 scripts/smoke_test.py
      - name: Browser smoke test (full campaigns)
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          node scripts/e2e_smoke.js

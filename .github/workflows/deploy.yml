name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .cpanel.yml
            game-counter.json
            hall-of-fame-pending.json
            hall-of-fame.json
            challenge-config.json
            hof-config.php
            GAME_MANUAL.md
            VADEMECUM.md
            ROADMAP.md
            ANALISI_SITO_2026-07.md
            DATASET_ANALYSIS.md
            CHECKLIST_TEST_5.6.2.md
            RECOVERY_INVENTORY.md
            dataset-editor.html
            _studio.html
            _mock_*.html
            _launch_kit.md
            _build_*.py
            _sync_version.py
            wc_build.py
            wc_patch.py
            wc_constants.js
            tools/**

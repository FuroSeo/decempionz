<script>
const JERSEY_COLORS={psv_8788:'#cc0000',por_8687:'#003087',liv_7677:'#cc0000',rm_6566:'#f5f5f5',fey_6970:'#cc0000',ben_6162:'#cc0000',int_6465:'#1c3fa8',cel_6667:'#1e8c1e',mu_6768:'#cc0000',mil_6869:'#cc0000',aja_7172:'#cc0000',bay_7475:'#cc0000',liv_7778:'#cc0000',ast_8182:'#7b003c',not_7980:'#cc0000',ham_8283:'#dcdcdc',liv_8384:'#cc0000',juv_8485:'#3a3a3a',ste_8586:'#cc0000',red_9091:'#cc0000',bar_9192:'#a50044',mars_9293:'#009fd4',aja_9495:'#cc0000',mil_9394:'#cc0000',juv_9596:'#3a3a3a',bvb_9697:'#f5dc00',mu_9899:'#cc0000',val_0001:'#eeeeee',bay_0001:'#cc0000',rm_0102:'#f5f5f5',mil_0203:'#cc0000',juve_0203:'#3a3a3a',ars_0304:'#cc0000',mu_0203:'#cc0000',por_0304:'#003087',liv_0405:'#cc0000',bar_0506:'#a50044',che_0506:'#034694',mil_0607:'#cc0000',mu_0708:'#cc0000',bar_0809:'#a50044',che_0809:'#034694',bay_0910:'#cc0000',int_0910:'#1c3fa8',mu_1011:'#cc0000',bay_1213:'#cc0000',che_1112:'#034694',rm_1314:'#f5f5f5',atm_1314:'#cc0000',bar_1415:'#a50044',mon_1617:'#cc0000',rm_1718:'#f5f5f5',rom_1718:'#8b1a1a',tot_1819:'#eeeeee',liv_1819:'#cc0000',mci_1819:'#6caddf',bay_1920:'#cc0000',psg_2021:'#004170',che_2021:'#034694',rm_2122:'#f5f5f5',mci_2223:'#6caddf',liv_2122:'#cc0000',rm_5960:'#f5f5f5',glad_7677:'#f0f0f0',sam_9192:'#003087',aja_1819:'#cc0000',juv_1415:'#3a3a3a'};

const WC_JERSEY_COLORS={uru_1930:'#9bc4e2',arg_1930:'#74acd6',ita_1934:'#003087',cze_1934:'#d40000',ita_1938:'#003087',hun_1938:'#cc0000',uru_1950:'#9bc4e2',bra_1950:'#f5c800',ger_1954:'#f0f0f0',hun_1954:'#cc0000',bra_1958:'#f5c800',swe_1958:'#006AA7',bra_1962:'#f5c800',cze_1962:'#d40000',eng_1966:'#f0f0f0',ger_1966:'#f0f0f0',por_1966:'#006600',bra_1970:'#f5c800',ita_1970:'#003087',ger_1974:'#f0f0f0',ned_1974:'#f07800',pol_1974:'#f0f0f0',arg_1978:'#74acd6',ned_1978:'#f07800',bra_1978:'#f5c800',ita_1982:'#003087',bra_1982:'#f5c800',ger_1982:'#f0f0f0',pol_1982:'#f0f0f0',fra_1982:'#002395',arg_1986:'#74acd6',ger_1986:'#f0f0f0',fra_1986:'#002395',bra_1986:'#f5c800',ger_1990:'#f0f0f0',arg_1990:'#74acd6',ita_1990:'#003087',eng_1990:'#f0f0f0',bra_1994:'#f5c800',ita_1994:'#003087',bul_1994:'#006749',fra_1998:'#002395',bra_1998:'#f5c800',cro_1998:'#cc3333',ned_1998:'#f07800',bra_2002:'#f5c800',ger_2002:'#f0f0f0',tur_2002:'#e30a17',kor_2002:'#c60c30',ita_2006:'#003087',fra_2006:'#002395',ger_2006:'#f0f0f0',por_2006:'#006600',esp_2010:'#d00000',ned_2010:'#f07800',ger_2014:'#f0f0f0',arg_2014:'#74acd6',bra_2014:'#f5c800',fra_2018:'#002395',cro_2018:'#cc3333',bel_2018:'#000080',arg_2022:'#74acd6',fra_2022:'#002395',mar_2022:'#c1272d',cro_2022:'#cc3333',ger_1958:'#f0f0f0',fra_1958:'#002395',chi_1962:'#cc0000',ussr_1966:'#cc0000',rom_1994:'#ffcc00',swe_1994:'#006AA7',uru_2010:'#9bc4e2',ned_2014:'#f07800'};
var SETS=[['🏆 UCL',TEAMS,'ucl'],['🌎 Copa',COPA_TEAMS,'copa'],['🌍 World Cup',WC_TEAMS,'wc']];
function jerseyCol(id,t){return JERSEY_COLORS[id]||COPA_JERSEY_COLORS[id]||WC_JERSEY_COLORS[id]||teamColor(t.name)}
function sprite(col,cls){var c=col||'#555';return '<svg class="'+(cls||'spr-s')+'" viewBox="0 0 26 30" style="display:block;margin:0 auto 2px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.5))"><ellipse cx="13" cy="7" rx="5.5" ry="6" fill="#FFCC88"/><rect x="8" y="13" width="10" height="8" rx="2" fill="'+c+'"/><rect x="5" y="13" width="4" height="7" rx="1.5" fill="'+c+'"/><rect x="17" y="13" width="4" height="7" rx="1.5" fill="'+c+'"/><rect x="9" y="21" width="4" height="7" rx="1.5" fill="#e8e8e8"/><rect x="13" y="21" width="4" height="7" rx="1.5" fill="#e8e8e8"/><rect x="9" y="26" width="4" height="3" rx="1" fill="#1a1a1a"/><rect x="13" y="26" width="4" height="3" rx="1" fill="#1a1a1a"/></svg>'}
var TAB='sfida',PICKED=[];
function natFlag(c){if(!c)return'';var sp={EN:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',SC:'🏴󠁧󠁢󠁳󠁣󠁴󠁿',WLS:'🏴󠁧󠁢󠁷󠁬󠁳󠁿',NIR:'🇬🇧'};if(sp[c])return sp[c];if(c.length===2)return String.fromCodePoint(0x1F1E6+c.charCodeAt(0)-65)+String.fromCodePoint(0x1F1E6+c.charCodeAt(1)-65);return c}
function teamColor(name){var hu=0;for(var i=0;i<name.length;i++)hu=(hu*31+name.charCodeAt(i))%360;return 'hsl('+hu+',62%,42%)'}
function fillSelect(sel){var el=document.getElementById(sel);el.innerHTML='';SETS.forEach(function(s){var og=document.createElement('optgroup');og.label=s[0];Object.keys(s[1]).sort(function(a,b){return (s[1][a].name+s[1][a].season).localeCompare(s[1][b].name+s[1][b].season)}).forEach(function(id){var t=s[1][id],o=document.createElement('option');o.value=s[2]+':'+id;o.textContent=t.name+' '+t.season;og.appendChild(o)});el.appendChild(og)})}
function getTeamV(v){var p=v.split(':'),db={ucl:TEAMS,copa:COPA_TEAMS,wc:WC_TEAMS}[p[0]];return {t:db[p[1]],id:p[1],mode:p[0]}}
function getTeam(v){return getTeamV(v).t}
function grp(pos){var D=['RB','LB','CB'],M=['CDM','CM','CAM','AM','LM','RM'];return pos==='GK'?'GK':D.indexOf(pos)>-1?'DEF':M.indexOf(pos)>-1?'MID':'FWD'}
function pflag(p,t){return natFlag(p.nat||t.country||'')}
function setTab(x){TAB=x;['sfida','vs','rosa','guess','topxi','fans','rank'].forEach(function(k){document.getElementById('pn-'+k).style.display=k===x?'block':'none';document.getElementById('tb-'+k).classList.toggle('on',k===x)})}
var ALLP=[];SETS.forEach(function(s){Object.keys(s[1]).forEach(function(id){var t=s[1][id];(t.players||[]).forEach(function(pl){ALLP.push({p:pl,t:t,id:id})})})});
function searchP(q){var box=document.getElementById('presults');q=(q||'').trim().toLowerCase();if(q.length<2){box.style.display='none';return}var hits=ALLP.filter(function(x){return x.p.n.toLowerCase().indexOf(q)>-1}).slice(0,25);box.innerHTML=hits.map(function(x){return '<div onclick="pick('+ALLP.indexOf(x)+')">'+x.p.n+' — '+x.t.name+' '+x.t.season+' ('+x.p.p+')</div>'}).join('')||'<div>nessun risultato</div>';box.style.display='block'}
function pick(i){if(PICKED.length>=3)return;PICKED.push(ALLP[i]);renderPicked();document.getElementById('presults').style.display='none';document.getElementById('psearch').value=''}
function renderPicked(){document.getElementById('ppicked').innerHTML=PICKED.map(function(x,i){return '<span onclick="PICKED.splice('+i+',1);renderPicked()">'+x.p.n+' ✕</span>'}).join('')}
function head(title){return '<div class="st-head"><div class="st-title">'+title.replace(/\*([^*]+)\*/g,'<em>$1</em>')+'</div></div>'}
function foot(){return '<div class="st-foot"><div class="st-brand">Decempionz</div><div class="st-url">gioca gratis su decempionz.com</div></div>'}
function xiFromTeam(t){var by={GK:[],DEF:[],MID:[],FWD:[]};(t.players||[]).slice().sort(function(a,b){return b.r-a.r}).forEach(function(p){by[grp(p.p)].push(p)});var lines={GK:by.GK.slice(0,1),DEF:by.DEF.slice(0,4),MID:by.MID.slice(0,3),FWD:by.FWD.slice(0,3)},count=lines.GK.length+lines.DEF.length+lines.MID.length+lines.FWD.length;if(count<11){var rest=[];['DEF','MID','FWD'].forEach(function(g){by[g].slice(lines[g].length).forEach(function(p){rest.push({g:g,p:p})})});rest.sort(function(a,b){return b.p.r-a.p.r});while(count<11&&rest.length){var x=rest.shift();lines[x.g].push(x.p);count++}}return lines}
var HIDE_SET=null;function hideP(p){return HIDE_SET&&HIDE_SET.indexOf(p)>-1}
function teamHalf(t,hideMode,tid){var col=jerseyCol(tid||'',t),lines=xiFromTeam(t);HIDE_SET=null;if(hideMode==='all')HIDE_SET=[].concat(lines.GK,lines.DEF,lines.MID,lines.FWD);else if(hideMode==='3'){var all=[].concat(lines.GK,lines.DEF,lines.MID,lines.FWD);HIDE_SET=all.slice().sort(function(){return Math.random()-.5}).slice(0,3)}var html='<div class="half"><div class="tname">'+t.name+'<small>'+t.season+'</small></div>';['FWD','MID','DEF','GK'].forEach(function(g){if(!lines[g].length)return;html+='<div class="line">'+lines[g].map(function(p){return '<div class="pcard'+(hideP(p)?' hidden-p':'')+'">'+sprite(col)+'<div class="nm">'+(hideP(p)?'? ? ?':p.n)+'</div><div class="fl">'+pflag(p,t)+'</div></div>'}).join('')+'</div>'});return html+'</div>'}
var ROLE_IT={GK:'Portiere',RB:'Terzino destro',LB:'Terzino sinistro',CB:'Difensore centrale',CDM:'Mediano',CM:'Centrocampista',CAM:'Trequartista',AM:'Trequartista',LM:'Esterno sinistro',RM:'Esterno destro',LW:'Ala sinistra',RW:'Ala destra',SS:'Seconda punta',CF:'Centravanti',ST:'Centravanti'};
function fillGuessPlayers(){var t=getTeam(document.getElementById('selG').value),el=document.getElementById('selGP');el.innerHTML='';(t.players||[]).slice().sort(function(a,b){return b.r-a.r}).forEach(function(pl,i){var o=document.createElement('option');o.value=i;o.textContent=pl.n+' ('+pl.p+' · '+pl.r+'★)';el.appendChild(o)})}
function fillEras(){var el=document.getElementById('selEra');el.innerHTML='';[['🏆 UCL',TOURNAMENTS,TEAMS,'ucl'],['🌎 Copa',COPA_TOURNAMENTS,COPA_TEAMS,'copa'],['🌍 WC',WC_TOURNAMENTS,WC_TEAMS,'wc']].forEach(function(s){var og=document.createElement('optgroup');og.label=s[0];var oAll=document.createElement('option');oAll.value=s[3]+':__all__';oAll.textContent='Tutte le ere';og.appendChild(oAll);s[1].forEach(function(e){var o=document.createElement('option');o.value=s[3]+':'+e.id;o.textContent=e.name+' ('+(e.years||'')+')';og.appendChild(o)});el.appendChild(og)})}
function clueChip(ic,txt){return '<div style="display:inline-flex;align-items:center;gap:10px;background:rgba(17,25,40,.9);border:2px solid var(--brd);border-radius:16px;padding:12px 24px;font-size:27px;font-weight:700;color:#fff">'+ic+' '+txt+'</div>'}
function bestXI(mode,eraId){var db={ucl:TEAMS,copa:COPA_TEAMS,wc:WC_TEAMS}[mode],lists={ucl:TOURNAMENTS,copa:COPA_TOURNAMENTS,wc:WC_TOURNAMENTS}[mode],ids=eraId==='__all__'?Object.keys(db):((lists.find(function(e){return e.id===eraId})||{}).teams||[]),pool=[],seen={};ids.forEach(function(id){var t=db[id];if(!t)return;(t.players||[]).forEach(function(pl){var key=pl.n;if(seen[key]&&seen[key].p.r>=pl.r)return;seen[key]={p:pl,t:t,id:id}})});Object.keys(seen).forEach(function(k){pool.push(seen[k])});pool.sort(function(a,b){return b.p.r-a.p.r});function take(g,n){var out=[];for(var i=0;i<pool.length&&out.length<n;i++)if(grp(pool[i].p.p)===g)out.push(pool[i]);out.forEach(function(x){pool.splice(pool.indexOf(x),1)});return out}return {GK:take('GK',1),DEF:take('DEF',4),MID:take('MID',3),FWD:take('FWD',3)}}
function xiCard(x,hideClub){return '<div class="pcard">'+sprite(jerseyCol(x.id||'',x.t))+'<div class="nm">'+x.p.n+'</div><div class="fl">'+pflag(x.p,x.t)+(hideClub?'':' <span style="color:#8fa0b5;font-size:12px">'+x.t.name+' '+x.t.season+'</span>')+'</div></div>'}
function render(){HIDE_SET=null;var st=document.getElementById('stage');st.className=document.getElementById('ratio').value;var html='';if(TAB==='sfida'){var av=getTeamV(document.getElementById('selA').value),bv=getTeamV(document.getElementById('selB').value);html=head(document.getElementById('ttl-sfida').value)+'<div class="st-body">'+teamHalf(av.t,null,av.id)+'<div class="vs">VS</div>'+teamHalf(bv.t,null,bv.id)+'</div>'+foot()}else if(TAB==='vs'){if(!PICKED.length){alert('Cerca e seleziona 2-3 giocatori');return}html=head(document.getElementById('ttl-vs').value)+'<div class="st-body big">'+PICKED.map(function(x,i){return(i>0?'<div class="vs">VS</div>':'')+'<div class="pcard">'+sprite(jerseyCol(x.id,x.t),'spr-b')+'<div class="nm">'+x.p.n+'</div><div class="fl">'+pflag(x.p,x.t)+'</div><div class="club">'+x.t.name+' · '+x.t.season+'</div></div>'}).join('')+'</div>'+foot()}else if(TAB==='guess'){var gv=getTeamV(document.getElementById('selG').value),Tg=gv.t,idx=parseInt(document.getElementById('selGP').value)||0,pl=(Tg.players||[]).slice().sort(function(a,b){return b.r-a.r})[idx],clues=[clueChip('👕',ROLE_IT[pl.p]||pl.p),clueChip('🌍',pflag(pl,Tg)),clueChip('🏟️',Tg.name+' · '+Tg.season)];if(document.getElementById('gRating').checked)clues.push(clueChip('⭐','Rating '+pl.r));html=head(document.getElementById('ttl-guess').value)+'<div class="st-body big" style="flex-direction:column;gap:26px"><div class="pcard">'+sprite(jerseyCol(gv.id,Tg),'spr-b')+'<div class="nm" style="letter-spacing:6px">? ? ?</div></div><div style="display:flex;flex-direction:column;gap:14px;align-items:center">'+clues.join('')+'</div><div style="font-size:24px;color:var(--mut)">La risposta nei commenti 👇</div></div>'+foot()}else if(TAB==='topxi'){var ev=document.getElementById('selEra').value.split(':'),xi=bestXI(ev[0],ev[1]);html=head(document.getElementById('ttl-topxi').value)+'<div class="st-body"><div class="half" style="max-width:none;flex:1">'+['FWD','MID','DEF','GK'].map(function(g){if(!xi[g].length)return'';return '<div class="line">'+xi[g].map(function(x){return xiCard(x)}).join('')+'</div>'}).join('')+'</div></div>'+foot()}else if(TAB==='fans'){var fv=getTeamV(document.getElementById('selF').value),Tf=fv.t,lows=(Tf.players||[]).slice().sort(function(a,b){return a.r-b.r}).slice(0,3);html=head(document.getElementById('ttl-fans').value)+'<div style="text-align:center;font-size:30px;color:var(--mut);margin-top:-14px">'+Tf.name+' '+Tf.season+' — tutti ricordano le stelle, ma loro?</div><div class="st-body big">'+lows.map(function(pl){return '<div class="pcard">'+sprite(jerseyCol(fv.id,Tf),'spr-b')+'<div class="nm">'+pl.n+'</div><div class="fl">'+pflag(pl,Tf)+'</div><div class="club">'+(ROLE_IT[pl.p]||pl.p)+'</div></div>'}).join('')+'</div>'+foot()}else if(TAB==='rank'){var scope=document.getElementById('selRank').value,rows=[];SETS.forEach(function(s){if(scope!=='all'&&s[2]!==scope)return;Object.keys(s[1]).forEach(function(id){var t=s[1][id],ps=t.players||[];if(ps.length<10)return;var avg=ps.reduce(function(a,x){return a+x.r},0)/ps.length;rows.push({t:t,avg:avg,mode:s[0]})})});rows.sort(function(a,b){return b.avg-a.avg});var top=rows.slice(0,5),mx=top[0].avg;html=head(document.getElementById('ttl-rank').value)+'<div style="text-align:center;font-size:26px;color:var(--mut);margin-top:-14px">media rating della rosa — secondo i dati di Decempionz</div><div class="st-body" style="flex-direction:column;gap:20px;align-items:stretch;padding:20px 70px">'+top.map(function(r,i){var w=Math.round(38+62*((r.avg-7.4)/(mx-7.4+0.001)));return '<div style="display:flex;align-items:center;gap:18px"><div style="font-family:Oswald;font-size:44px;font-weight:700;color:'+(i===0?'var(--gold2)':'var(--mut)')+';width:64px">'+(i+1)+'.</div><div style="flex:1"><div style="font-size:30px;font-weight:800">'+r.t.name+' <span style="color:var(--mut);font-weight:600">'+r.t.season+'</span> <span style="font-size:20px">'+r.mode.split(' ')[0]+'</span></div><div style="height:16px;border-radius:8px;background:var(--s2);margin-top:8px"><div style="height:16px;border-radius:8px;width:'+w+'%;background:linear-gradient(90deg,var(--gold),var(--gold2))"></div></div></div><div style="font-family:Oswald;font-size:42px;font-weight:700;color:var(--gold2)">'+r.avg.toFixed(2)+'</div></div>'}).join('')+'</div>'+foot()}else{var rv=getTeamV(document.getElementById('selR').value),hide=document.getElementById('hideN').value;html=head(document.getElementById('ttl-rosa').value)+'<div class="st-body"><div style="flex:1;max-width:72%">'+teamHalf(rv.t,hide,rv.id).replace('class="half"','class="half" style="max-width:none"')+'</div></div>'+foot()}st.innerHTML=html;fitStage()}
function fitStage(){var st=document.getElementById('stage'),avail=Math.min(document.querySelector('.stagewrap').clientWidth,760),sc=Math.min(1,avail/st.offsetWidth);document.getElementById('scaler').style.transform='scale('+sc+')';document.getElementById('scaler').style.height=(st.offsetHeight*sc)+'px'}
function downloadPNG(){var st=document.getElementById('stage');if(!st.innerHTML){alert('Prima premi Genera');return}var sc=document.getElementById('scaler'),old=sc.style.transform;sc.style.transform='none';html2canvas(st,{backgroundColor:'#07090f',scale:1}).then(function(cv){sc.style.transform=old;var a=document.createElement('a');a.download='decempionz-'+TAB+'-'+Date.now()+'.png';a.href=cv.toDataURL('image/png');a.click()}).catch(function(e){sc.style.transform=old;alert('Export fallito ('+e.message+'): fai uno screenshot del riquadro.')})}
window.addEventListener('resize',fitStage);fillSelect('selA');fillSelect('selB');fillSelect('selR');fillSelect('selG');fillSelect('selF');fillEras();fillGuessPlayers();document.getElementById('selB').selectedIndex=1;render();
</script>
